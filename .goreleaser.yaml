version: 2
project_name: nummion

before:
  hooks:
    - bash scripts/completions.sh

builds:
  - id: num
    main: ./cmd/num
    binary: num
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [num]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - README.md
      - src: completions/*
        dst: completions
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

signs:
  - cmd: cosign
    signature: '${artifact}.bundle'
    args: ['sign-blob', '--yes', '--bundle=${signature}', '${artifact}']
    artifacts: checksum

# Optional Apple Developer ID signing and notarization, performed before packaging.
notarize:
  macos:
    - ids: [num]
      enabled: '{{ and (ne (index .Env "MACOS_SIGN_P12") "") (ne (index .Env "MACOS_SIGN_PASSWORD") "") (ne (index .Env "MACOS_NOTARY_KEY") "") (ne (index .Env "MACOS_NOTARY_KEY_ID") "") (ne (index .Env "MACOS_NOTARY_ISSUER_ID") "") }}'
      sign:
        certificate: '{{ index .Env "MACOS_SIGN_P12" }}'
        password: '{{ index .Env "MACOS_SIGN_PASSWORD" }}'
      notarize:
        issuer_id: '{{ index .Env "MACOS_NOTARY_ISSUER_ID" }}'
        key_id: '{{ index .Env "MACOS_NOTARY_KEY_ID" }}'
        key: '{{ index .Env "MACOS_NOTARY_KEY" }}'
        wait: true

release:
  github:
    owner: JangoCG
    name: nummion
  draft: false
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
  extra_files:
    - glob: scripts/install.sh
    - glob: scripts/install.ps1

changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']

homebrew_casks:
  - name: nummion
    ids: [default]
    binaries: [num]
    description: Unofficial Lexware Office CLI — run it with num
    homepage: https://github.com/JangoCG/nummion
    license: MIT
    directory: Casks
    skip_upload: auto
    repository:
      owner: JangoCG
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    completions:
      bash: completions/num.bash
      zsh: completions/_num
      fish: completions/num.fish

scoops:
  - name: nummion
    ids: [default]
    description: Unofficial Lexware Office CLI — run it with num
    homepage: https://github.com/JangoCG/nummion
    license: MIT
    directory: bucket
    skip_upload: auto
    repository:
      owner: JangoCG
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'

nfpms:
  - id: packages
    ids: [num]
    package_name: nummion
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    vendor: JangoCG
    homepage: https://github.com/JangoCG/nummion
    maintainer: JangoCG <https://github.com/JangoCG>
    description: Unofficial Lexware Office CLI — run it with num
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    contents:
      - src: completions/num.bash
        dst: /usr/share/bash-completion/completions/num
      - src: completions/_num
        dst: /usr/share/zsh/site-functions/_num
      - src: completions/num.fish
        dst: /usr/share/fish/vendor_completions.d/num.fish
