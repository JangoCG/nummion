name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- Same-commit local workflow reference, matching the reference release setup.

  security:
    uses: ./.github/workflows/security.yml # zizmor: ignore[self-repository] -- Same-commit local workflow reference, matching the reference release setup.

  release:
    needs: [test, security]
    environment: release
    timeout-minutes: 45
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release setup
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RELEASE_CLIENT_ID: ${{ vars.RELEASE_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || { echo 'Use a v1.2.3 or v1.2.3-rc.1 tag.'; exit 1; }
          [[ "$RELEASE_REPOSITORY" == JangoCG/nummion ]] || { echo 'Rename the repository to JangoCG/nummion before publishing.'; exit 1; }
          [[ "$REPOSITORY_PRIVATE" == false ]] || { echo 'Public installers require a public repository.'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release tags must point to a commit on main.'; exit 1; }
          if [[ "$RELEASE_TAG" != *-* && ( -z "$RELEASE_CLIENT_ID" || -z "$RELEASE_APP_PRIVATE_KEY" ) ]]; then
            echo 'Stable releases require RELEASE_CLIENT_ID and RELEASE_APP_PRIVATE_KEY in the release environment.'
            exit 1
          fi
      - name: Generate a short-lived token for the tap
        if: ${{ !contains(github.ref_name, '-') }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: JangoCG
          repositories: homebrew-tap
          permission-contents: write
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, sign checksums, publish GitHub release and update tap
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
